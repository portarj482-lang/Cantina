name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repo Hygiene & Secrets Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan for tracked runtime and secret artifacts
        run: |
          TRACKED=$(git ls-files | grep -E '(\.env($|\.local)|node_modules/|__pycache__/|\.pytest_cache/|\.log$|\.pid$|\.so$|\.dylib$)' || true)
          if [ -n "$TRACKED" ]; then
            echo "::error::Tracked transient or secret artifacts detected:"
            echo "$TRACKED"
            exit 1
          fi
          echo "Repo hygiene check passed: zero tracked runtime artifacts."

      - name: Generate Untracked Size Audit Report
        run: |
          git status --porcelain -uall | awk '/^\?\?/ {print substr($0,4)}' | tr '\n' '\0' > /tmp/untracked0.list
          cat /tmp/untracked0.list | du --files0-from=- -sb 2>/dev/null | sort -rn | head -n 200 > /tmp/top200_untracked.txt || true

      - name: Upload Top-200 Untracked Audit Artifact
        uses: actions/upload-artifact@v4
        with:
          name: top200-untracked-audit
          path: /tmp/top200_untracked.txt
          if-no-files-found: warn

  test-python:
    name: Python Test Suite (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: hygiene
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Execute unit test discovery
        run: |
          python -m unittest discover -s tests/universal_adaptive -v
