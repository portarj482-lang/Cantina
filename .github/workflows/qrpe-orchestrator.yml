name: QRPE Autonomous Pipeline & Verification Orchestrator

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: qrpe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene-and-reconcile:
    name: Monorepo Hygiene & Registry Parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Monorepo Hygiene Gate
        run: |
          make audit

      - name: Install Mesh Dependencies
        run: |
          cd security-mesh/security-mesh
          npm ci

      - name: Build Security Mesh Registry
        run: |
          cd security-mesh/security-mesh
          npm run build

      - name: Verify Agent & Oracle Registry Reconciliation
        run: |
          cd security-mesh/security-mesh
          npx tsx ../../scripts/reconcile-registries.ts --verify

  test-suites:
    name: Universal Adaptive & Security Mesh Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js & Python
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Initialize Public Test Submodules
        run: |
          git submodule update --init --recursive bounties/base/contracts bounties/base/base bounties/agglayer/ulxly-contracts bounties/agglayer/vault-bridge bounties/agglayer/agglayer-contracts bounties/liquity/bold || true

      - name: Install Python Dependencies
        run: |
          python3 -m pip install -e ".[dev]"

      - name: Run Python Universal Adaptive Test Suite
        run: |
          python3 -m unittest discover -s tests/universal_adaptive

      - name: Lint and Typecheck Python
        run: |
          make lint typecheck

      - name: Run TypeScript Security Mesh Test Suite
        run: |
          cd security-mesh/security-mesh
          npm ci
          npm run typecheck
          npm test

  pipeline-dry-run:
    name: QRPE Workflow Packs A-G Dry-Run
    runs-on: ubuntu-latest
    needs: [hygiene-and-reconcile, test-suites]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js & Python
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Initialize Public Test Submodules
        run: |
          git submodule update --init --recursive bounties/base/contracts bounties/base/base bounties/agglayer/ulxly-contracts bounties/agglayer/vault-bridge || true

      - name: Install Python Dependencies
        run: |
          python3 -m pip install -e ".[dev]"

      - name: Execute QRPE Full Pipeline Dry-Run
        run: |
          ./scripts/run-qrpe-pipeline.sh --dry-run
