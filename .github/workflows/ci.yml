name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repo Hygiene & Secrets Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan for tracked runtime and secret artifacts
        run: |
          TRACKED=$(git ls-files | grep -E '(\.env($|\.local)|node_modules/|__pycache__/|\.pytest_cache/|\.log$|\.pid$|\.so$|\.dylib$)' || true)
          if [ -n "$TRACKED" ]; then
            echo "::error::Tracked transient or secret artifacts detected:"
            echo "$TRACKED"
            exit 1
          fi
          echo "Repo hygiene check passed: zero tracked runtime artifacts."

  test-python:
    name: Python Test Suite (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: hygiene
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Execute unit test discovery
        run: |
          python -m unittest discover -s tests/universal_adaptive -v
