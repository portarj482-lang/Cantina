name: Security Mesh CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Build, Unit Tests & Offline Smoke Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm test

      - name: Security & Policy Smoke Checks
        run: npm run smoke

      - name: Source Manifest Generation Validation
        run: |
          mkdir -p /tmp/fixture-repo
          cd /tmp/fixture-repo
          git init
          git config user.email "ci@example.com"
          git config user.name "CI"
          echo "contract Fixture {}" > Fixture.sol
          git add Fixture.sol
          git commit -m "initial commit"
          COMMIT_SHA=$(git rev-parse HEAD)
          cd -
          node ./scripts/generate-source-manifest.mjs /tmp/fixture-repo https://github.com/example/fixture $COMMIT_SHA > /tmp/manifest.json
          test -s /tmp/manifest.json

  integration:
    name: PostgreSQL Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mesh
          POSTGRES_PASSWORD: mesh_test_password
          POSTGRES_DB: security_mesh_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgres://mesh:mesh_test_password@127.0.0.1:5432/security_mesh_integration
        run: npm run db:migrate

      - name: Run PostgreSQL Integration Tests
        env:
          DATABASE_URL: postgres://mesh:mesh_test_password@127.0.0.1:5432/security_mesh_integration
          TEST_DATABASE_URL: postgres://mesh:mesh_test_password@127.0.0.1:5432/security_mesh_integration
        run: npm run test:integration
