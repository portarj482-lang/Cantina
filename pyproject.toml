[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cantina-universal-adaptive-engine"
version = "0.1.0"
description = "Universal Adaptive Engineering Engine and Multi-Agent Security Audit Mesh"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Repository Steward & Detective", email = "devops@cantina.local" }
]
dependencies = [
    "jsonschema>=4.10.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "types-PyYAML>=6.0.12",
    "types-jsonschema>=4.10.0",
]

[project.scripts]
uae = "universal_adaptive_engine.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
where = ["."]
include = ["universal_adaptive_engine*"]
